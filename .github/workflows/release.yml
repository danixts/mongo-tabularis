name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  BINARY_NAME: tabularis-mongodb-plugin
  GO_VERSION: "1.26.4"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update manifest.json version
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' manifest.json > manifest.tmp.json
          mv manifest.tmp.json manifest.json

      - name: Upload manifest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: manifest.json

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            platform: linux-x64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            platform: linux-arm64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            platform: darwin-x64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            platform: darwin-arm64
            runner: macos-latest
          - goos: windows
            goarch: amd64
            platform: win-x64
            runner: windows-latest

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download manifest artifact
        uses: actions/download-artifact@v4
        with:
          name: manifest

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        shell: bash
        run: |
          ext=""
          if [ "${{ matrix.goos }}" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-s -w" -o "${BINARY_NAME}${ext}" ./cmd/tabularis-mongodb-plugin
          mkdir staging
          mv "${BINARY_NAME}${ext}" staging/
          cp manifest.json staging/
          if [ -d ui ]; then cp -r ui staging/ui; fi

      - name: Package
        shell: bash
        run: |
          cd staging
          if [ "${{ matrix.goos }}" = "windows" ]; then
            7z a "../mongodb-plugin-${{ matrix.platform }}.zip" .
          else
            zip -r "../mongodb-plugin-${{ matrix.platform }}.zip" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mongodb-plugin-${{ matrix.platform }}
          path: mongodb-plugin-${{ matrix.platform }}.zip

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: artifacts/*.zip
          generate_release_notes: true
